services:
  - type: web
    name: learnafrica-backend
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      # Auto-generate a strong signing secret on first deploy. The app refuses
      # to start in production without SECRET_KEY/JWT_SECRET.
      - key: SECRET_KEY
        generateValue: true
      # Set these in the Render dashboard (sync: false keeps them out of git):
      #   PAYSTACK_SECRET_KEY  — REQUIRED. Without it the app refuses to start
      #                          rather than silently running free "mock" payments.
      #   JWT_SECRET           — optional override for SECRET_KEY
      #   ALLOWED_ORIGINS      — comma-separated frontend origins
      #
      #   SENDPULSE_CLIENT_ID      — SendPulse API key (ID). Required for email OTP.
      #   SENDPULSE_CLIENT_SECRET  — SendPulse API key (secret). Required for email OTP.
      #   SENDPULSE_SENDER_EMAIL   — a sender address verified in SendPulse.
      #   SENDPULSE_SENDER_NAME    — display name, e.g. "LearnAfrica" (optional).
      # Without all three of ID/secret/sender email, signup email OTP silently
      # fails and users are logged in without verification.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SENDPULSE_CLIENT_ID
        sync: false
      - key: SENDPULSE_CLIENT_SECRET
        sync: false
      - key: SENDPULSE_SENDER_EMAIL
        sync: false
      - key: SENDPULSE_SENDER_NAME
        sync: false
